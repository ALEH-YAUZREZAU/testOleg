
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мои ссылки</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 420px;
      margin: 80px auto;
      padding: 24px;
    }

    h1 { margin-bottom: 8px; }
    p { color: #666; margin-bottom: 32px; }

    a {
      display: block;
      padding: 16px;
      margin: 12px 0;
      border-radius: 12px;
      background: #222;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover { background: #444; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Привет! 👋</h1>
    <p>Мои контакты и социальные сети</p>

    <a href="https://t.me/username">Telegram</a>
    <a href="https://github.com/username">GitHub</a>
    <a href="mailto:hello@example.com">Написать мне</a>
  </main>
</body>
</html>
